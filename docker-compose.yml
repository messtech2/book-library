services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]

  server:
    build: { context: ./server, target: dev }
    ports: ["4000:4000"]
    environment:
      PORT: 4000
      MONGO_URL: mongodb://mongo:27017/library
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on: [mongo]

  client:
    build: { context: ./client, target: dev }
    ports: ["5173:5173"]
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on: [server]

volumes:
  mongo-data: